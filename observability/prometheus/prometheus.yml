# Basic Prometheus scrape config for the PaymentFlow backend.
# Scrapes Spring Boot Actuator's Micrometer registry (Phase 6, ADR-012).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "paymentflow-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
