# Minimal Grafana dashboard provisioning — auto-loads JSON dashboards placed
# alongside this file.
apiVersion: 1

providers:
  - name: paymentflow-dashboards
    orgId: 1
    folder: PaymentFlow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
