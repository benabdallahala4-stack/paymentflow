apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: paymentflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentflow-frontend
  template:
    metadata:
      labels:
        app: paymentflow-frontend
    spec:
      containers:
        - name: frontend
          image: paymentflow-frontend:local
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
