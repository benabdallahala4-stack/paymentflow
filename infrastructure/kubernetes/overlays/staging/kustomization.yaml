# Staging overlay — ASPIRATIONAL / DOCUMENT-ONLY. No staging cluster exists or is
# targeted by this project. Shown to illustrate how replicas/resources would be
# patched per environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paymentflow-staging
resources:
  - ../../base
replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2
patches:
  - path: resources-patch.yaml
